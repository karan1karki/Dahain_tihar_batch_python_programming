<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{{ cafe_name }} | Shop</title>
    </head>
    <body>
        <section>
            <h1>{{ message }}</h1>
            <table border="1">
                <tr>
                    <th> Deserts name </th>
                    <th> Price </th>
                </tr>
                {% for item in deserts %}
                    <tr>
                        <td> {{ item.name }}</td>
                        <td> {{ item.price }}</td>
                    </tr>
                {% endfor %}
            </table>
        </section>
    </body>
</html>
